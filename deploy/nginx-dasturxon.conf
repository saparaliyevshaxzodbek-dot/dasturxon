# Linux server (Ubuntu): /etc/nginx/sites-available/dasturxon
# The app listens on http://localhost:5000 (see dasturxon.service); nginx serves the domain and HTTPS.
server {
    listen 80;
    server_name sizning-domen.uz www.sizning-domen.uz;

    client_max_body_size 6m;   # dish photo uploads are limited to 5 MB

    location / {
        proxy_pass         http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SignalR (live order updates) needs WebSocket upgrade.
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 100s;
    }
}
# HTTPS: sudo certbot --nginx -d sizning-domen.uz -d www.sizning-domen.uz
